manifestVersion: 1
name: "@henryrennerv/swamp-telemetry-audit"
# Version is finalized at publish time — `swamp extension push` computes the next CalVer.
version: "2026.06.12.6"
description: >
  Audit the telemetry the swamp CLI phones home: a model + report that turn swamp-logger's
  captured event store into a repeatable swamp pipeline, surfacing commands run, the stable
  distinct_id/$repo_id fingerprint, environment, AI-agent detection, and failed invocations.
  Requires the @henryrennerv/swamp-logger skill to capture events first — this extension only
  consumes the event store swamp-logger generates; it produces nothing on its own.
license: MIT
repository: "https://github.com/henry-renner-v/swamp-extensions"
additionalFiles:
  - README.md
  - LICENSE.txt
models:
  - telemetry_audit.ts
reports:
  - telemetry_audit.ts
